<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socialy - Tela Inicial (Preview Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #181a20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 12px;
      color: #e2e8f0;
    }

    .top-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .top-info h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      background: rgba(220, 88, 109, 0.18);
      border: 1px solid rgba(220, 88, 109, 0.35);
      color: #ff98aa;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
    }

    /* Smartphone Mockup Frame */
    .phone-frame {
      width: 100%;
      max-width: 375px;
      height: 720px;
      background: #FFEBEF;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #2c2e36, 0 0 0 12px #3b3e48;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* iOS Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 24px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
      fill: #1a1a1a;
    }

    /* Dynamic Island / Notch pill */
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 24px;
      background: #20222a;
      border-radius: 16px;
      z-index: 15;
    }

    /* Screen Body */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 28px 48px 28px;
      position: relative;
    }

    /* Logo area */
    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      animation: fadeIn 0.6s ease-out;
    }

    .logo-img {
      width: 190px;
      height: 185px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(220, 88, 109, 0.15));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.04);
    }

    /* Central Tagline */
    .tagline-container {
      text-align: center;
      padding: 0 10px;
      animation: fadeIn 0.8s ease-out;
    }

    .tagline-text {
      font-size: 19px;
      line-height: 1.4;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.2px;
    }

    /* Buttons Container */
    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 1s ease-out;
    }

    .btn {
      width: 100%;
      height: 52px;
      border: none;
      outline: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: #DC586D;
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(220, 88, 109, 0.32);
    }

    .btn-primary:hover {
      background-color: #cb4e62;
      box-shadow: 0 10px 22px rgba(220, 88, 109, 0.42);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #1a1a1a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .btn-secondary:hover {
      background-color: #fafafa;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    /* Home Indicator Bar */
    .home-indicator {
      width: 130px;
      height: 5px;
      background: #1a1a1a;
      border-radius: 10px;
      margin-top: 14px;
      opacity: 0.8;
    }

    /* Toast Notification Modal */
    .toast-modal {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e2026;
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast-modal.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-modal .toast-dot {
      width: 8px;
      height: 8px;
      background: #DC586D;
      border-radius: 50%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="top-info">
    <h1>Socialy - Tela Inicial</h1>
    <span class="badge">React Native • Expo Preview</span>
  </div>

  <div class="phone-frame">
    <div class="notch"></div>

    <div class="status-bar">
      <span>09:41</span>
      <div class="status-icons">
        <!-- Signal -->
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" style="display:none"/><rect x="2" y="16" width="3" height="5" rx="1"/><rect x="7" y="12" width="3" height="9" rx="1"/><rect x="12" y="8" width="3" height="13" rx="1"/><rect x="17" y="4" width="3" height="17" rx="1"/></svg>
        <!-- Wifi -->
        <svg viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"/></svg>
        <!-- Battery -->
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="4" y="9" width="12" height="6" rx="1"/><path d="M21 10h1a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-1v-4z"/></svg>
      </div>
    </div>

    <div class="screen-content">
      <!-- Logo Socialy -->
      <div class="logo-wrapper">
        <img 
          src="assets/socialy-logo-transparent.png" 
          alt="Socialy Logo" 
          class="logo-img"
          onerror="this.src='assets/socialy-logo.png'"
        />
      </div>

      <!-- Frase Central -->
      <div class="tagline-container">
        <p class="tagline-text">
          Conecte-se com as pessoas e<br>compartilhe momentos.
        </p>
      </div>

      <!-- Botões de Ação -->
      <div class="buttons-container">
        <button class="btn btn-primary" onclick="triggerAction('Entrar')">
          Entrar
        </button>

        <button class="btn btn-secondary" onclick="triggerAction('Criar conta')">
          Criar conta
        </button>
      </div>

      <div class="home-indicator"></div>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="toast-modal">
      <span class="toast-dot"></span>
      <span id="toast-text">Ação executada</span>
    </div>
  </div>

  <script>
    let toastTimeout;
    function triggerAction(actionName) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      
      toastText.innerText = 'Clicou em "' + actionName + '"';
      toast.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }
  </script>
</body>
</html>
